name: Apply verified Markdown math formatting
on:
  push:
    branches: [codex/markdown-math-delimiters]
    paths: [.github/workflows/codex-markdown-math.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify formatting-only edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, copy, json, re, hashlib
          def normalize(s):
              return s.replace(r'\(', '$').replace(r'\)', '$').replace(r'\[', '$$').replace(r'\]', '$$')
          source_pattern = re.compile(r'("source"\s*:\s*)(\[(?:\s*"(?:[^"\\]|\\.)*"\s*,?)*\s*\]|"(?:[^"\\]|\\.)*")')
          for path in sorted(Path('notebooks').glob('*.ipynb')):
              old = path.read_text()
              before = json.loads(old)
              expected = copy.deepcopy(before)
              markdown_sources = set()
              for cell in expected['cells']:
                  if cell['cell_type'] != 'markdown':
                      continue
                  source = cell['source']
                  markdown_sources.add(json.dumps(source))
                  cell['source'] = [normalize(s) for s in source] if isinstance(source, list) else normalize(source)
              def replace_source(match):
                  encoded = match.group(2)
                  if json.dumps(json.loads(encoded)) not in markdown_sources:
                      return match.group(0)
                  for delimiter, replacement in [(r'\\(', '$'), (r'\\)', '$'), (r'\\[', '$$'), (r'\\]', '$$')]:
                      encoded = encoded.replace(delimiter, replacement)
                  return match.group(1) + encoded
              after = source_pattern.sub(replace_source, old)
              assert json.loads(after) == expected, path
              if after != old:
                  path.write_text(after)
          for path in sorted(Path('.').glob('*.md')):
              old = path.read_text()
              after = normalize(old)
              if after != old:
                  path.write_text(after)
          class NormalizeConstants(ast.NodeTransformer):
              def visit_Constant(self, node):
                  if isinstance(node.value, str):
                      node.value = normalize(node.value)
                  return node
          for path in sorted(Path('scripts').glob('build*.py')):
              old = path.read_text()
              after = old
              for delimiter, replacement in [(r'\\(', '$'), (r'\\)', '$'), (r'\\[', '$$'), (r'\\]', '$$')]:
                  after = after.replace(delimiter, replacement)
              after = normalize(after)
              assert ast.dump(ast.parse(after)) == ast.dump(NormalizeConstants().visit(ast.parse(old))), path
              if after != old:
                  path.write_text(after)
          
          expected_blobs = {"README.md":"f3c1468c0ff51644a3fe338dfdd22d8351fd7fc1","notebooks/01_generate_amplitudes.ipynb":"c3e612b189b3840dc5d7f1956b30ed97e29e6634","notebooks/02_preselection.ipynb":"0d252b37d9f2052829b996fa78c7023fea5e7387","notebooks/03_unbinned_nsbi.ipynb":"ee2bfcbb0498e2fe0fd969649c94b835f7ffe5b2","notebooks/08_reference_ratio_histograms.ipynb":"6a5b6c62ea463e46b85cc354c42e044f503e2a17","notebooks/09_reference_ratio_spline_templates.ipynb":"df973bf8fbb3564c373037af9ce8807c41c64502","notebooks/10_discriminator_histograms.ipynb":"8e24369b6c337932f2fe6bf48bf2df5da3f6c893","notebooks/11_test_statistic_toys.ipynb":"d45ae455e22e6ec5c6568b9fbed0859c222e180f","notebooks/12_toy_diagnostics.ipynb":"ce3d9eee9bc045547d5b9577f6ea697638098a41","notebooks/13_learned_ratio_compression.ipynb":"4013b6fb6a4daefb9e65ca3067a2b2cd258803b9","scripts/build_comparison_notebooks.py":"d6b835066e51e2a2072a9896096eacdf7216bc76","scripts/build_learned_compression_notebook.py":"6ad09da7ca31f3a58dc5a41bff6b1adbbbb0e4ca","scripts/build_notebooks.py":"5202c28a2a665643e0d464b325dff3b90f1c3451","scripts/build_reference_notebooks.py":"7692da870705d949d8278e92aa1d06cfc38ad9b7","scripts/build_toy_diagnostics_notebook.py":"9c83871db83c16fdd3446cd2a1a3176f8a1ba644"}
          for name, expected_sha in expected_blobs.items():
              data = Path(name).read_bytes()
              actual_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual_sha == expected_sha, (name, actual_sha, expected_sha)
          print('All 15 files match the locally verified formatting change exactly.')
          PY
          git diff --check
          git add README.md notebooks/*.ipynb scripts/build*.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use dollar delimiters for Markdown math throughout notebooks'
          git push origin HEAD:codex/markdown-math-delimiters
