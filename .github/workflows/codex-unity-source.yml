name: Publish verified Unity workflow sources
on:
  push:
    branches: [codex/unity-ensembles]
    paths: [.github/workflows/codex-unity-source.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested source changes without executing notebooks
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(""))
          subprocess.run(['git', 'apply', '--binary', '-'], input=patch, check=True)
          expected = {".gitattributes":"5469b4c0d9f2bb86ffb0f6aecdf0f50e629afe46",".gitignore":"713c80fef2d926b39d939b37f9aa3088808d7c85","README.md":"09bf8c3a466654aed8718d2c6a2704c3a8ef177d","notebooks/03_unbinned_nsbi.ipynb":"d01d64803d3af2e4da51b408ce36d9c4de48d00f","poodemo/closure_validation.py":"205faeead63a0b1f8f426d56cd3c59837c802195","poodemo/ensemble_bundle.py":"ea88e928119f4dc6fbaeb62cc857b8e1362a60b7","poodemo/training.py":"e574a41e53040472d0a131a83fbb066c9f8b5428","pyproject.toml":"260e078e6877fa901c49426c1bf50353c67a2dc0","scripts/build_notebooks.py":"076ac13f4baad556cf97b4b61eda88ffceaa3e7f","tests/test_unity_workflow.py":"84005f59cd4b477657a6bb79e0645bb355fe5876","unity/README.md":"89edcbe2fcbc30fea1bdb1dc500a52feb1eacb61","unity/__init__.py":"70b1a94649ee41a936eb7679d0fbcab82f3f6235","unity/config.json":"16acd1e1b267546856d6e064f060f910b1336e6c","unity/job.sh":"635753c578de376a11f0815b3ea424685ac7e2a6","unity/publish.py":"1e0f645c8093cff505adbcc948e7ad789f15628c","unity/requirements.txt":"304f0c3697a2c33f2f1c7caa7d118b232c172fbc","unity/source/preselection.json":"4f6d2526268cc0fe187d1e7a0182d56f06e39474","unity/source/preselection/history.json":"c08ff6539503932601352c155769dcb7e02bcd96","unity/source/preselection/model.pt":"3fdab15fd5dcf71d3b7dbb7b3c1e7404b4c43b1d","unity/source/preselection/selection.json":"f4b13ec857dce595d150d4474c928591b3c7dd4c","unity/source/preselection/training.json":"d462848156d250af67aee40c72ddc24e5e64867b","unity/source/provenance.json":"e51881e89ef6056975d245bc80e6bba9c0daea83","unity/source/run.json":"9816fe9bc7a752c01e76e415d5be8d35334be55b","unity/source/selection_state.json":"d6c1a45078877abd40f713e85fab15398e98b79e","unity/submit.py":"9b5e08f9d274bee884b34c587892d699dc7f7dbe","unity/workflow.py":"933738f2371d1c4bdf8a7b36ce9649ec53f86254"}
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, name
              if name.endswith('.py'): ast.parse(data)
          old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:notebooks/03_unbinned_nsbi.ipynb']))
          new = json.loads(pathlib.Path('notebooks/03_unbinned_nsbi.ipynb').read_text())
          assert [c.get('outputs') for c in old['cells'] if c['cell_type'] == 'code'] == [c.get('outputs') for c in new['cells'] if c['cell_type'] == 'code' and c.get('id') != 'unity-source-code']
          print('Verified all source/model hashes and preserved notebook outputs.')
          PY
          git diff --check
          git add -- '.gitattributes' '.gitignore' 'README.md' 'notebooks/03_unbinned_nsbi.ipynb' 'poodemo/closure_validation.py' 'poodemo/ensemble_bundle.py' 'poodemo/training.py' 'pyproject.toml' 'scripts/build_notebooks.py' 'tests/test_unity_workflow.py' 'unity/README.md' 'unity/__init__.py' 'unity/config.json' 'unity/job.sh' 'unity/publish.py' 'unity/requirements.txt' 'unity/source/preselection.json' 'unity/source/preselection/history.json' 'unity/source/preselection/model.pt' 'unity/source/preselection/selection.json' 'unity/source/preselection/training.json' 'unity/source/provenance.json' 'unity/source/run.json' 'unity/source/selection_state.json' 'unity/submit.py' 'unity/workflow.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Unity training and model publication for large ratio ensembles'
          git push origin HEAD:codex/unity-ensembles
