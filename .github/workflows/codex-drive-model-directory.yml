name: Publish verified Drive model loading change
on:
  push:
    branches: [codex/drive-model-directory]
    paths: [.github/workflows/codex-drive-model-directory.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked source change without executing notebooks
        run: |
          python3 - <<'PY'
          import ast, base64, hashlib, json, pathlib, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(""))
          subprocess.run(['git', 'apply', '--binary', '-'], input=patch, check=True)
          expected = {"README.md":"288700b76b0a79c964657078fd0132113c52a36a","notebooks/03_unbinned_nsbi.ipynb":"f6c690221cad16c602ea9fa50608c428f4b77232","scripts/build_notebooks.py":"cb8169a721b15ef07c8fda89647d06400e8f56eb","tests/test_notebook_unity_directory.py":"e3baf433f6bdd8c6b7e0764b3b10a3804de77fc3","unity/README.md":"a236172ceee9d4ba95fb78c55b515927c3e89539"}
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha, name
              if name.endswith('.py'): ast.parse(data)
          old = json.loads(subprocess.check_output(['git', 'show', 'HEAD:notebooks/03_unbinned_nsbi.ipynb']))
          new = json.loads(pathlib.Path('notebooks/03_unbinned_nsbi.ipynb').read_text())
          assert len(old['cells']) == len(new['cells'])
          for a, b in zip(old['cells'], new['cells']):
              if a != b:
                  assert a['id'] in ('unity-source-code', 'unity-source-intro')
                  assert {k:v for k,v in a.items() if k != 'source'} == {k:v for k,v in b.items() if k != 'source'}
          print('Verified source hashes and preserved notebook outputs.')
          PY
          git diff --check
          git add -- 'README.md' 'notebooks/03_unbinned_nsbi.ipynb' 'scripts/build_notebooks.py' 'tests/test_notebook_unity_directory.py' 'unity/README.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Load notebook 03 Unity models directly from Google Drive'
          git push origin HEAD:codex/drive-model-directory
